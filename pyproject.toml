[project]
name = "sreevija-vastara"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<7",
    "dj-database-url>=2.2",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[tool.vercel]
entrypoint = "config.wsgi:application"

[tool.vercel.scripts]
build = "python build.py"
